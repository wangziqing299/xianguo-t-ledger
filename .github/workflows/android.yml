name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 同一分支只保留最新一次构建：避免两次 push 并发去 --clobber 同一个 latest 资产
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: xianguo-t-ledger-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 不用第三方 setup-android：自己装，SDK 版本和路径完全可控
      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"
          # 每一步都是独立 shell，必须写进 GITHUB_ENV / GITHUB_PATH 才能传给后续步骤
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set build number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle

      - name: Build debug APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: xianguo-t-ledger-debug-apk
          path: ${{ env.APK_NAME }}

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK_NAME" --clobber
          else
            gh release create latest "$APK_NAME" \
              --title "先沽后补 · 最新 APK" \
              --notes "调试签名 APK，个人侧载使用。数据仅保存在手机本机，不上传服务器。" \
              --latest
          fi

      # 失败只维护一个 open issue：已有就追加评论，没有才新建，避免连刷
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "构建失败：${RUN_URL}"
            echo
            echo '```'
            tail -n 300 build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } > failure.md

          TITLE="CI build failed on ${GITHUB_REF_NAME}"
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "追加到已有 issue #$existing"
            gh issue comment "$existing" --body-file failure.md
          else
            gh issue create --title "$TITLE" --body-file failure.md
          fi
